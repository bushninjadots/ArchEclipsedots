# matugen: recolours the desktop from the wallpaper. qs-wallpaperpicker runs
# `matugen image <wallpaper>` every time you set a wallpaper.

[config]

# The wallpaper picker's own colours.
[templates.qs-wallpaperpicker]
input_path = "~/.config/qs-wallpaperpicker/extras/matugen/quickshell.json.hbs"
output_path = "~/.config/qs-wallpaperpicker/colors/Colors.json"

# ArchEclipse bar, panels and lock screen (theme/Theme.qml watches this file).
[templates.archeclipse]
input_path = "~/.config/qs-wallpaperpicker/extras/matugen/quickshell.json.hbs"
output_path = "~/.cache/quickshell/colors.json"

# kitty: kitty.conf includes this; SIGUSR1 makes open windows reload it.
[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors-matugen.conf"
post_hook = "pkill -USR1 -x kitty || true"

# Ryoku desktop widgets (~/.config/ryoku-widgets): the Material roles in
# camelCase plus terminal colours, the shape Ryoku's widgets read.
[templates.ryoku-widgets]
input_path = "~/.config/matugen/templates/ryoku-colors.json"
output_path = "~/.cache/ryoku/colors.json"
# The wallpaper's lightness map: the widgets pick light/dark text from it.
post_hook = "~/.config/ryoku-widgets/bin/wallpaper-tone"
